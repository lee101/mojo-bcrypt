[project]
name = "mojo-bcrypt"
version = "0.1.0"
description = "OpenBSD bcrypt_pbkdf implemented in Mojo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
keywords = ["mojo", "bcrypt", "kdf", "cryptography"]

[project.optional-dependencies]
dev = ["pytest", "bcrypt"]

[project.urls]
Homepage = "https://github.com/lee101/mojo-bcrypt"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
